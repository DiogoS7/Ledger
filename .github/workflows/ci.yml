name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out Ledger
        uses: actions/checkout@v7
        with:
          repository: DiogoS7/Ledger
          path: Ledger
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . pytest anyio
      - name: Tests
        env:
          LEDGER_HOME: ${{ github.workspace }}/Ledger
        run: python -m pytest -q
